<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清掃英会話れんしゅう（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#22303a; --sub:#6b7780; --line:#e4e0d6;
  --accent:#1f7a6d; --accent-soft:#e3f1ee; --guest:#b8642a; --guest-soft:#fbeee3;
  --ok:#2e8b57; --ok-soft:#e5f4ea; --ng:#c0392b; --ng-soft:#fbe7e4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.6}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 120px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h1 small{font-size:11px;font-weight:500;color:var(--sub);background:#ebe7dd;border-radius:99px;padding:1px 8px}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;font-weight:500;color:var(--sub)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.total{font-size:12px;color:var(--sub);margin-top:6px}
.bar{height:6px;background:#e7e3da;border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.scene{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.scene-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:12px 14px}
.scene-h .no{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.scene-h .nm{flex:1;font-weight:500}
.scene-h .ct{font-size:12px;color:var(--sub)}
.scene-h .ar{color:var(--sub);transition:transform .2s}
.scene.open .ar{transform:rotate(90deg)}
.plist{display:none;border-top:1px solid var(--line)}
.scene.open .plist{display:block}
.prow{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid #f0ede6;background:none;text-align:left;padding:10px 14px}
.prow:last-child{border-bottom:0}
.prow .n{font-size:12px;color:var(--sub);width:22px;flex:none}
.prow .t{flex:1}
.prow .g{font-size:11px;color:var(--guest);background:var(--guest-soft);border-radius:6px;padding:0 6px;flex:none}
.prow .d{width:22px;text-align:center;color:var(--ok);font-weight:700;flex:none}

.sheet-bg{position:fixed;inset:0;background:rgba(20,30,35,.45);z-index:20;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding:16px 18px 22px}
.sheet.on{transform:none}
.sheet-in{max-width:600px;margin:0 auto}
.sh-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.x{border:0;background:#f0ede6;border-radius:99px;width:32px;height:32px;font-size:16px}
.who{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;margin-top:8px}
.who.s{background:var(--accent-soft);color:var(--accent)}
.who.g{background:var(--guest-soft);color:var(--guest)}
.ja{font-size:20px;font-weight:700;margin:8px 0 4px}
.en{font-size:19px;margin:6px 0;padding:10px 12px;background:#f8f7f3;border-radius:10px;letter-spacing:.01em}
.en.hide{color:transparent;user-select:none;background:repeating-linear-gradient(45deg,#efece5,#efece5 8px,#f6f4ee 8px,#f6f4ee 16px);position:relative}
.en.hide::after{content:"英語は隠れています";position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.b{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:500}
.b.p{background:var(--accent);border-color:var(--accent);color:#fff}
.b.gp{background:var(--guest);border-color:var(--guest);color:#fff}
.b.mic{background:#fff;border:2px solid var(--accent);color:var(--accent);flex:1;min-width:140px;padding:14px}
.b.mic.rec{background:var(--ng);border-color:var(--ng);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
.b:disabled{opacity:.45}
.res{margin-top:12px;padding:12px;border-radius:12px;background:#f8f7f3;display:none}
.res.on{display:block}
.res .heard{font-size:13px;color:var(--sub)}
.res .words{font-size:18px;margin:6px 0;line-height:1.9}
.w{border-radius:5px;padding:1px 4px;margin-right:2px}
.w.ok{background:var(--ok-soft);color:var(--ok)}
.w.ng{background:var(--ng-soft);color:var(--ng);text-decoration:underline wavy}
.res .msg{font-weight:700}
.self{display:flex;gap:8px;margin-top:8px}
.nav{display:flex;gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.nav .b{flex:1}
.done-btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.note{font-size:12px;color:var(--sub);margin-top:8px}

.dlist .scene-h{border-bottom:0}
.chat{margin-top:12px}
.bub{max-width:88%;border-radius:14px;padding:10px 12px;margin:8px 0;position:relative}
.bub.g{background:var(--guest-soft);border-top-left-radius:4px}
.bub.s{background:var(--accent-soft);margin-left:auto;border-top-right-radius:4px}
.bub .lb{font-size:11px;color:var(--sub)}
.bub .e{font-size:17px}
.bub .j{font-size:13px;color:var(--sub)}
.bub .e.hide{filter:blur(6px);user-select:none}
.turn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.dhead{display:flex;align-items:center;gap:8px;margin-top:14px}
.dhead .b{padding:6px 12px}
.dhead .tt{flex:1;font-weight:700}

.set{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.set h3{margin:0 0 8px;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #f0ede6}
.row:first-of-type{border-top:0}
.row select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.sw{width:48px;height:28px;border-radius:99px;border:0;background:#d9d5cc;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
.env{font-size:13px}
.env b{font-weight:500}
.dlg{position:fixed;inset:0;z-index:40;background:rgba(20,30,35,.5);display:none;place-items:center;padding:20px}
.dlg.on{display:grid}
.dlg-in{background:#fff;border-radius:16px;padding:18px;max-width:340px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:8px 16px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>清掃英会話れんしゅう <small>試作</small></h1>

/* ===== 読み上げ ===== */
let voices=[];
function loadVoices(){try{voices=(speechSynthesis.getVoices()||[]).filter(v=>/^en[-_]/i.test(v.lang));}catch(e){voices=[]}try{const el=document.getElementById("svoice");if(el)el.innerHTML=voiceOptions();}catch(e){}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
let ctts=null;
// 自然な声を優先し、機械っぽい声・おもしろ声は後回しにする
const GOOD=/natural|neural|premium|enhanced|google us english|samantha|ava|aria|jenny|allison|zoe|evan|nathan|joelle|susan|tom|michelle|emma|guy|christopher/i;
const BAD=/compact|eloquence|desktop|fred|albert|bad news|bells|boing|bubbles|cellos|junior|ralph|trinoids|whisper|zarvox|superstar|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|wobble|organ|jester/i;
function rankVoice(v){let r=0;if(/en[-_]US/i.test(v.lang))r+=4;if(GOOD.test(v.name))r+=6;if(/natural|neural|premium|enhanced/i.test(v.name))r+=4;if(BAD.test(v.name))r-=10;if(v.localService===false)r+=1;return r;}
function rankedVoices(){return voices.slice().sort((a,b)=>rankVoice(b)-rankVoice(a));}
function pickVoice(guest){
  if(!voices.length)return null;
  const list=rankedVoices();
  if(S.voice&&S.voice!=="auto"&&S.voice!=="claude"){const v=voices.find(x=>x.name===S.voice);if(v){if(!guest)return v;return list.find(x=>x.name!==v.name&&rankVoice(x)>0)||v;}}
  if(!guest)return list[0];
  return list.find((x,i)=>i>0&&rankVoice(x)>=rankVoice(list[0])-4)||list[0];
}
let speakTok=0,spokeTok=-1,isSpeaking=false;
function useClaudeVoice(){return ctts&&(S.voice==="claude"||((!S.voice||S.voice==="auto")));}
function speak(text,guest,slow){
  const rate=(slow||S.slow)?0.7:0.95;
  if(useClaudeVoice()){
    try{speechSynthesis.cancel()}catch(e){}
    if(!ttsWired){ttsWired=true;try{ctts.onState(({state})=>{if(state==="speaking"){spokeTok=speakTok;isSpeaking=true;}else isSpeaking=false;});}catch(e){}}
    const tok=++speakTok;
    // Claudeの声が出なかったときだけ端末の声に切り替える（次の再生で止められた時は何もしない＝二重再生を防ぐ）
    ctts.speak(text,{voice:guest?"airy":"buttery",rate:Math.max(.7,rate),language:"en"}).catch(()=>{if(tok===speakTok&&spokeTok!==tok)nativeSpeak(text,guest,rate,true);});return;
  }
  if(!nativeSpeak(text,guest,rate))toast("この画面では音声が出せません");
}
function nativeSpeak(text,guest,rate,fromFallback){
  if(!(window.speechSynthesis&&window.SpeechSynthesisUtterance))return false;
  try{
    if(!fromFallback){try{ctts&&ctts.stop()}catch(e){}}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate;
    const v=pickVoice(guest);if(v)u.voice=v;
    if(v&&pickVoice(false)&&v.name===pickVoice(false).name&&guest)u.pitch=1.15;
    u.onstart=()=>{isSpeaking=true;};u.onend=u.onerror=()=>{isSpeaking=false;};
    speechSynthesis.speak(u);return true;
  }catch(e){return false;}
}

/* ===== 聞き取り ===== */
let dict=null;const NativeRec=window.SpeechRecognition||window.webkitSpeechRecognition;
function micMode(){return dict?"dict":(NativeRec?"native":"none");}
let listening=null;let dcur=null;let dictWired=false,ttsWired=false;
function startListen(onPartial,onDone,onFail){
  if(dict){
    // 聞き取りの受け口は1回だけ登録し、いま開いている練習画面にだけ結果を渡す
    if(!dictWired){
      dictWired=true;
      dict.onPartial(({text})=>{const c=dcur;if(c)c.onPartial((c.txt+" "+text).trim());});
      dict.onFinal(({text})=>{const c=dcur;if(!c)return;const t=(text||"").trim();if(t&&!c.txt.endsWith(t)){c.txt=t.toLowerCase().startsWith(c.txt.toLowerCase())?t:(c.txt+" "+t).trim();}c.onPartial(c.txt);clearTimeout(c.timer);c.timer=setTimeout(()=>dict.stop().catch(()=>{}),1300);});
      dict.onState(({state,reason})=>{const c=dcur;if(state==="idle"&&c){dcur=null;listening=null;clearTimeout(c.timer);if(c.txt)c.onDone([c.txt]);else c.onFail(reason==="viewer_stopped"||reason==="stopped"?"no-speech":(reason||"no-speech"));}});
    }
    try{speechSynthesis.cancel()}catch(e){} try{ctts&&ctts.stop()}catch(e){}
    dcur={txt:"",timer:null,onPartial,onDone,onFail};
    listening={stop:()=>{dict.stop().catch(()=>{});}};
    dict.start().catch(err=>{dcur=null;listening=null;onFail(err&&err.code||String(err));});
    return;
  }
  if(NativeRec){
    const r=new NativeRec();r.lang="en-US";r.interimResults=true;r.maxAlternatives=3;r.continuous=false;
    let alts=[];
    r.onresult=e=>{const res=e.results[e.results.length-1];alts=[];for(let i=0;i<res.length;i++)alts.push(res[i].transcript);onPartial(alts[0]||"");};
    r.onerror=e=>{if(listening){listening=null;onFail(e.error);}};
    r.onend=()=>{if(listening){listening=null;onDone(alts);}};
    listening={stop:()=>{try{r.stop()}catch(e){}}};
    try{r.start();}catch(e){listening=null;onFail("start");}
    return;
  }
  onFail("none");
}

/* ===== 判定 ===== */
const NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,twenty:20,thirty:30};
const CON={"i'm":"i am","you're":"you are","it's":"it is","that's":"that is","there's":"there is","i'll":"i will","you'll":"you will","i've":"i have","i'd":"i would","you'd":"you would","don't":"do not","can't":"can not","cannot":"can not","haven't":"have not","isn't":"is not","we're":"we are","let's":"let us","everyone's":"everyone s","okay":"ok"};
function norm(t){
  t=t.toLowerCase().replace(/[’‘]/g,"'").replace(/a\.\s?m\.?/g,"am").replace(/p\.\s?m\.?/g,"pm").replace(/-/g," ").replace(/\bcheck(out|in)\b/g,"check $1").replace(/[^a-z0-9' ]/g," ");
  return t.split(/\s+/).filter(Boolean).flatMap(w=>{if(CON[w])return CON[w].split(" ");if(NUM[w]!==undefined)return [String(NUM[w])];return [w];}).map(w=>w.replace(/'s$/,"").replace(/'/g,""));
}
function score(target,heard){
  const tw=target.split(/\s+/).filter(Boolean);const pool=norm(heard);
  const used=new Array(pool.length).fill(false);let ok=0,tot=0;
  const marks=tw.map(w=>{
    const parts=norm(w);if(!parts.length)return{w,ok:true,skip:true};
    let all=true;parts.forEach(p=>{tot++;const i=pool.findIndex((x,k)=>!used[k]&&x===p);if(i>=0){used[i]=true;ok++;}else all=false;});
    return{w,ok:all};
  });
  return{marks,pct:tot?Math.round(ok/tot*100):0};
}
function bestScore(target,alts){let best=null;(alts||[]).forEach(a=>{const s=score(target,a||"");s.heard=a;if(!best||s.pct>best.pct)best=s;});return best||{marks:target.split(/\s+/).map(w=>({w,ok:false})),pct:0,heard:""};}

function wireMic(btn,res,en,onGood,onReveal,echo){
  const label=btn.textContent;
  btn.onclick=()=>{
    if(listening){listening.stop();return;}
    if(isSpeaking){try{speechSynthesis.cancel()}catch(e){} try{ctts&&ctts.stop()}catch(e){} isSpeaking=false;toast("声を止めました。もう一度🎤を押して話してください");return;}
    if(micMode()==="none"){showSelf();return;}
    btn.classList.add("rec");btn.textContent="⏹ 聞いています…（タップで終わる）";
    res.className="res on";res.innerHTML=`<div class="heard">聞き取り中：<span id="live"></span></div>`;
    startListen(t=>{const l=res.querySelector("#live");if(l)l.textContent=t;},
      alts=>{btn.classList.remove("rec");btn.textContent=label;showResult(alts);},
      err=>{btn.classList.remove("rec");btn.textContent=label;
        if(err==="no-speech"){res.innerHTML=`<div class="msg">声が聞こえませんでした。もう一度どうぞ。</div>`;return;}
        showSelf("マイクが使えませんでした。");});
  };
  function showResult(alts){
    const s=bestScore(en,alts);
    if(echo&&s.pct<50){const e=bestScore(echo,alts);if(e.pct>=70){
      res.className="res on";
      res.innerHTML=`<div class="heard">聞き取った言葉：${esc(e.heard||"")}</div><div class="msg" style="color:var(--guest)">それはゲストのセリフです。</div><div class="note">あなた（清掃員）が言うのは、上の日本語のセリフです。英語を見てから、もう一度どうぞ。<br>（ゲストの声をマイクが拾った場合は、声が終わってから🎤を押すか、イヤホンを使ってください）</div>`;onReveal&&onReveal();res.innerHTML+=``;
      return;}}
    const msg=s.pct>=80?"よくできました！":s.pct>=50?"おしい！赤いところをもう一度。":"お手本を聞いてから、もう一度どうぞ。";
    res.className="res on";
    res.innerHTML=`<div class="heard">聞き取った言葉：${esc(s.heard||"（なし）")}</div>
      <div class="words">${s.marks.map(m=>`<span class="w ${m.ok?"ok":"ng"}">${esc(m.w)}</span>`).join(" ")}</div>
      <div class="msg" style="color:${s.pct>=80?"var(--ok)":"var(--ng)"}">${s.pct}点　${msg}</div>`;
    onReveal&&onReveal();
    if(s.pct>=80)onGood&&onGood();
  }
  function showSelf(pre){
    res.className="res on";
    res.innerHTML=`<div>${pre?esc(pre)+"<br>":""}この画面では聞き取りが使えません。声に出して言ってから、英語を見て自分で判定してください。</div>
      <div class="self"><button class="b p" id="sok">○ 言えた</button><button class="b" id="sng">△ もう一度</button></div>`;
    onReveal&&onReveal();
    res.querySelector("#sok").onclick=()=>{onGood&&onGood();res.innerHTML=`<div class="msg" style="color:var(--ok)">よくできました！</div>`;};
    res.querySelector("#sng").onclick=()=>{res.className="res";};
  }
}

/* 会話 */
function dlgLines(sc){return D.find(d=>d[0]===sc)[1].filter(x=>Array.isArray(x)||PH[x]).map(x=>{if(Array.isArray(x))return{g:x[0]==="g",en:x[1],ja:x[2]};const p=PH[x];return{g:p.g,en:fill(p.en),ja:fill(p.ja),id:x};});}
function renderDlgList(){
  main.innerHTML=`<div class="set" style="margin-top:12px"><h3>🎲 1問1答（ランダム）</h3>
    <div class="note" style="margin-top:0">ゲストに何を言われるかわからない状態で、清掃員のセリフを返す練習です。</div>
    <div class="row"><span style="white-space:nowrap">場面</span><select id="qasc"><option value="0">全部まぜる</option>${SCENES.map((n,i)=>PAIRIDS(i+1).length?`<option value="${i+1}">${i+1}. ${esc(n)}</option>`:"").join("")}</select></div>
    <div class="btns"><button class="b p" id="qago" style="flex:1">はじめる</button></div></div>
    <h3 style="font-size:15px;margin:18px 0 0">場面ごとの会話</h3><div class="dlist">`+D.map(d=>{const sc=d[0];return `<div class="scene"><button class="scene-h" data-sc="${sc}"><span class="no">${sc}</span><span class="nm">${esc(SCENES[sc-1])}</span><span class="ct">${dlgLines(sc).length}行</span><span class="d" style="color:var(--ok);font-weight:700;width:20px">${S.dlg[sc]?"✓":""}</span><span class="ar">›</span></button></div>`;}).join("")+`</div><p class="note">ゲスト（オレンジ）の声を聞いて、清掃員（緑）のセリフを英語で返します。</p>`;
  main.querySelectorAll(".scene-h").forEach(h=>h.onclick=()=>playDlg(+h.dataset.sc));
  document.getElementById("qago").onclick=()=>playQA(+document.getElementById("qasc").value);
}
function PAIRIDS(sc){return P.filter(r=>!r[2]&&PAIR[r[0]]&&(!sc||r[1]===sc)).map(r=>r[0]);}
function playQA(sc){
  const pool=PAIRIDS(sc);let deck=[],qn=0,ok=0;
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  main.innerHTML=`<div class="dhead"><button class="b" id="qback">← 一覧</button><span class="tt">🎲 1問1答</span><span class="note" id="qcnt" style="margin:0"></span></div><div id="qbox"></div>`;
  document.getElementById("qback").onclick=()=>{if(listening)listening.stop();try{speechSynthesis.cancel()}catch(e){}try{ctts&&ctts.stop()}catch(e){}renderDlgList();updTotal();};
  const box=document.getElementById("qbox");
  function next(){
    if(listening)listening.stop();
    if(!deck.length)deck=shuffle(pool.slice());
    const id=deck.pop();qn++;const p=PH[id],pr=PAIR[id];const en=fill(p.en),ja=fill(p.ja),gen=fill(pr[1]),gja=fill(pr[2]);const before=pr[0]==="前";
    document.getElementById("qcnt").textContent=`${qn}問目・よくできた ${ok}`;
    const gb=`<div class="bub g" id="qg"><div class="lb">ゲスト</div><div class="e hide" id="qge">${esc(gen)}</div><div class="j" id="qgj" style="display:none">${esc(gja)}</div>
      <div class="btns" style="margin-top:6px"><button class="b gp" id="qgplay" style="padding:6px 12px">🔊 ${before?"もう一度聞く":"返事を聞く"}</button><button class="b" id="qgshow" style="padding:6px 12px">文字を見る</button></div></div>`;
    box.innerHTML=`<div class="chat">${before?gb:""}</div>
      <div class="turn"><span class="who s">あなたの番</span>
        <div class="ja" id="qja" ${before?'style="display:none"':""}>${esc(ja)}</div>
        ${before?`<div class="note" id="qhintn" style="margin-top:4px">ゲストに何と言われたか聞いて、英語で返してください。</div>`:""}
        <div class="en ${S.showEn?"":"hide"}" id="qen">${esc(en)}</div>
        <div class="btns"><button class="b mic" id="qmic">🎤 英語で返す</button></div><div class="res" id="qres"></div>
        <div class="btns">${before?`<button class="b" id="qhint">💡 ヒント（日本語）</button>`:""}<button class="b" id="qplay">🔊 お手本</button><button class="b" id="qshow">英語を見る</button></div></div>
      <div class="chat">${before?"":gb}</div>
      <div class="btns"><button class="b p" id="qnext" style="flex:1">次の問題 →</button></div>
      <p class="note">${sc?"練習中の場面："+esc(SCENES[sc-1]):"全部まぜて練習中"}　/　No.${id}</p>`;
    const $=x=>document.getElementById(x);
    const showG=()=>{$("qge").classList.remove("hide");$("qgj").style.display="block";};
    const reveal=()=>$("qen").classList.remove("hide");
    $("qgplay").onclick=()=>{speak(gen,true);if(!before)showG();};
    $("qgshow").onclick=showG;
    if(before){$("qhint").onclick=()=>{$("qja").style.display="block";$("qhintn").style.display="none";};}
    $("qplay").onclick=()=>{reveal();speak(en,false);};
    $("qshow").onclick=reveal;
    $("qnext").onclick=next;
    let counted=false;
    wireMic($("qmic"),$("qres"),en,()=>{S.done[id]=true;save();if(!counted){counted=true;ok++;document.getElementById("qcnt").textContent=`${qn}問目・よくできた ${ok}`;}if(!before){showG();setTimeout(()=>speak(gen,true),600);}},()=>{reveal();if(before){$("qja").style.display="block";$("qhintn").style.display="none";}},before?gen:null);
    if(before)setTimeout(()=>speak(gen,true),250);
    window.scrollTo(0,0);
  }
  next();
}
function playDlg(sc){
  const L=dlgLines(sc);let step=0;
  main.innerHTML=`<div class="dhead"><button class="b" id="dback">← 一覧</button><span class="tt">${sc}. ${esc(SCENES[sc-1])}</span><button class="b" id="dre">最初から</button></div><div class="chat" id="chat"></div><div id="turn"></div>`;
  document.getElementById("dback").onclick=()=>{if(listening)listening.stop();try{speechSynthesis.cancel()}catch(e){}renderDlgList();updTotal();};
  document.getElementById("dre").onclick=()=>playDlg(sc);
  const chat=document.getElementById("chat"),turn=document.getElementById("turn");
  function addBub(l,hideEn){
    const d=document.createElement("div");d.className="bub "+(l.g?"g":"s");
    d.innerHTML=`<div class="lb">${l.g?"ゲスト":"あなた（清掃員）"}</div><div class="e${hideEn?" hide":""}">${esc(l.en)}</div><div class="j">${esc(l.ja)}</div>`;
    if(l.g){d.style.cursor="pointer";d.onclick=()=>{d.querySelector(".e").classList.remove("hide");speak(l.en,true);};}
    chat.appendChild(d);return d;
  }
  function next(){
    if(step>=L.length){
      S.dlg[sc]=true;save();updTotal();
      turn.innerHTML=`<div class="turn"><div class="msg" style="color:var(--ok);font-weight:700">この場面の会話ができました！</div><div class="btns"><button class="b p" id="dnext">${sc<10?"次の場面へ →":"一覧へ"}</button><button class="b" id="dagain">もう一度</button></div></div>`;
      document.getElementById("dnext").onclick=()=>sc<10?playDlg(sc+1):renderDlgList();
      document.getElementById("dagain").onclick=()=>playDlg(sc);
      return;
    }
    const l=L[step];
    if(l.g){
      const b=addBub(l,!S.showEn);speak(l.en,true);
      turn.innerHTML=`<div class="turn"><div class="btns"><button class="b gp" id="gplay">🔊 もう一度聞く</button><button class="b" id="gslow">🐢 ゆっくり</button><button class="b" id="gshow">英語を見る</button></div><div class="btns"><button class="b p" id="gnext" style="flex:1">わかった → 次へ</button></div></div>`;
      document.getElementById("gplay").onclick=()=>speak(l.en,true);
      document.getElementById("gslow").onclick=()=>speak(l.en,true,true);
      document.getElementById("gshow").onclick=()=>b.querySelector(".e").classList.remove("hide");
      document.getElementById("gnext").onclick=()=>{b.querySelector(".e").classList.remove("hide");step++;next();};
    }else{
      turn.innerHTML=`<div class="turn"><span class="who s">あなたの番</span><div class="ja">${esc(l.ja)}</div><div class="en ${S.showEn?"":"hide"}" id="ten">${esc(l.en)}</div>
        <div class="btns"><button class="b mic" id="tmic">🎤 英語で言ってみる</button></div><div class="res" id="tres"></div>
        <div class="btns"><button class="b" id="tplay">🔊 お手本</button><button class="b" id="tshow">英語を見る</button><button class="b p" id="tnext" style="flex:1">次へ →</button></div></div>`;
      const reveal=()=>document.getElementById("ten").classList.remove("hide");
      wireMic(document.getElementById("tmic"),document.getElementById("tres"),l.en,()=>{if(l.id){S.done[l.id]=true;save();}},reveal,(step>0&&L[step-1].g)?L[step-1].en:null);
      document.getElementById("tplay").onclick=()=>{reveal();speak(l.en,false);};
      document.getElementById("tshow").onclick=reveal;
      document.getElementById("tnext").onclick=()=>{if(listening)listening.stop();addBub(l,false);step++;next();};
    }
    setTimeout(()=>turn.scrollIntoView({behavior:"smooth",block:"end"}),50);
  }
  next();
}

}

    di.innerHTML=`<div style="font-weight:700">記録をリセットしますか？</div><div class="note">「できた」の印がすべて消えます。設定はそのまま残ります。</div><div class="btns"><button class="b" id="rno" style="flex:1">やめる</button><button class="b" id="ryes" style="flex:1;background:var(--ng);border-color:var(--ng);color:#fff">リセット</button></div>`;
    dl.classList.add("on");
    g("rno").onclick=()=>dl.classList.remove("on");
    g("ryes").onclick=()=>{S.done={};S.dlg={};save();dl.classList.remove("on");updTotal();toast("記録をリセットしました");};
  };
}

/* ===== 最新のフレーズを読み込む（ガイドアプリの「英会話フレーズ」シート → 英会話フレーズAPI） ===== */
// 読めないときは、このページの中の控え（上の P・PAIR）で動く
const PHRASE_API="https://script.google.com/macros/s/AKfycbwi8ZlpDlvxplPucxrB6tPUMM4SmOisenQACpAVqrWNKnGh6j_yzDuKLCO7_pO5aOJw/exec";
const PKEY="seisou-eikaiwa-phrases";
let phraseSrc={kind:"控え",count:P.length,at:""};
function applyPhrases(list,at,kind){
  if(!Array.isArray(list)||list.length<5)return false;
  const ok=list.every(r=>Array.isArray(r)&&r.length>=5&&+r[0]>0&&+r[1]>=1&&+r[1]<=10&&r[3]&&r[4]);
  if(!ok)return false;
  P.length=0;Object.keys(PH).forEach(k=>delete PH[k]);Object.keys(PAIR).forEach(k=>delete PAIR[k]);
  list.slice().sort((a,b)=>a[1]-b[1]||a[0]-b[0]).forEach(r=>{
    const row=[+r[0],+r[1],r[2]?1:0,String(r[3]),String(r[4])];P.push(row);
    PH[row[0]]={id:row[0],sc:row[1],g:!!row[2],ja:row[3],en:row[4]};
    if(!row[2]&&(r[5]==="前"||r[5]==="後")&&r[6])PAIR[row[0]]=[r[5],String(r[6]),String(r[7]||"")];
  });
  phraseSrc={kind,count:P.length,at:at||""};
  return true;
}
(function(){try{const c=JSON.parse(localStorage.getItem(PKEY)||"null");if(c&&applyPhrases(c.phrases,c.at,"前回読み込んだもの"));}catch(e){}})();
render();
(async()=>{
  if(!/^https:\/\//.test(PHRASE_API))return;
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),10000);
    const r=await fetch(PHRASE_API,{signal:ctl.signal});clearTimeout(t);
    const j=await r.json();
    if(j&&j.ok&&applyPhrases(j.phrases,j.at,"最新")){
      try{localStorage.setItem(PKEY,JSON.stringify({at:j.at,phrases:j.phrases}));}catch(e){}
      const sh=document.getElementById("sheet");if(!sh||!sh.classList.contains("on")){if(view==="phr")renderPhr();else if(view==="set")renderSet();updTotal();}
    }
  }catch(e){}
})();

(async()=>{
  try{

      if(d)dict=d; if(t)ctts=t;

})();
